<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tienda de plantas online: compra plantas, accede a catálogo dinámico, carrito, pagos seguros y entrega rápida."
    />
    <meta
      name="keywords"
      content="plantas, tienda, ecommerce, comprar plantas, decoración, vivero, naturaleza"
    />
    <meta name="author" content="Ecommerce Web" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Ecommerce Web – Tienda de Plantas" />
    <meta
      property="og:description"
      content="Compra plantas online con pago seguro y entrega rápida. Catálogo dinámico, carrito y checkout con Stripe."
    />
    <meta property="og:type" content="website" />
    <!-- canonical y og:url los aplica utils/seo.ts por ruta, usando VITE_SITE_URL. -->
    <meta property="og:image" content="/favicon.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ecommerce Web – Tienda de Plantas" />
    <meta
      name="twitter:description"
      content="Compra plantas online con pago seguro y entrega rápida. Catálogo dinámico, carrito y checkout con Stripe."
    />
    <meta name="twitter:image" content="/favicon.svg" />
    <meta name="theme-color" content="#3a5a40" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..700,60&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <title>Ecommerce Web – Tienda de Plantas</title>
    <!--
      Aplica el tema antes del primer pintado.
      Tiene que ser sincrono y estar aqui: si esperase a que React monte,
      el usuario veria un destello claro antes de que llegara el tema oscuro.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('ecommerce.theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme =
            stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.style.colorScheme = theme
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
