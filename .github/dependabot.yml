version: 2
updates:
  # Los tres package.json del monorepo.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Agrupa las actualizaciones menores para no inundar de PRs.
      minor-and-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: npm
    directory: '/backend'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: npm
    directory: '/frontend'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
