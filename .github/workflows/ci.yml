name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela ejecuciones anteriores del mismo ref si llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      # Instalación limpia y reproducible en los tres paquetes.
      - name: Instalar dependencias
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Formato
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Los tests de backend arrancan un MongoDB en memoria (replica set),
      # así que no hacen falta servicios ni secretos.
      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Presupuesto de rendimiento
        run: npm run perf:budget --prefix frontend

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: quality
    services:
      # MongoDB como replica set de un nodo, necesario para las transacciones.
      # No requiere secretos: es una base de datos efímera del propio job.
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
    env:
      NODE_ENV: development
      # directConnection permite hablar con un replica set de un solo nodo sin
      # que el driver intente descubrir otros miembros.
      MONGODB_URI: mongodb://localhost:27017/?directConnection=true
      MONGODB_DB_NAME: ecommerce-e2e
      CORS_ORIGIN: 'http://127.0.0.1:4173'
      # Secretos JWT solo para el job; el backend exige mínimo 16 caracteres.
      JWT_ACCESS_SECRET: e2e_access_secret_not_a_real_key
      JWT_REFRESH_SECRET: e2e_refresh_secret_not_a_real_key
      # Stripe y Cloudinary quedan sin configurar: esas funciones degradan y el
      # test de pago se salta solo.
      VITE_API_BASE_URL: http://localhost:4000/api
      VITE_SITE_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Instalar dependencias
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Inicializar el replica set de MongoDB
        run: |
          docker exec ${{ job.services.mongodb.id }} mongosh --quiet --eval \
            'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] })' || true

      - name: Sembrar el catálogo
        run: npm run seed:products --prefix backend

      - name: Arrancar el backend
        run: |
          npm run dev --prefix backend &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/api/health > /dev/null; then
              echo "Backend listo"; exit 0
            fi
            sleep 2
          done
          echo "El backend no arrancó a tiempo"; exit 1

      - name: Instalar Chromium para Playwright
        run: npm run test:e2e:install --prefix frontend

      - name: Tests e2e
        run: npm run test:e2e --prefix frontend

      - name: Subir informe de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
